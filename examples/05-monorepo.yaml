# 모노레포 — 어느 패키지를 검증할지 시작할 때 고르는 형태.
# 패키지 이름을 명령에 끼워 넣는 변수 치환은 없다. 모델이 정한 문자열이 셸 명령이 되면 안 된다.
# 명령은 전부 yaml 에 고정하고 items 로 고른다.
#   plan 모드: 사용자에게 묻는다 / quick 모드: AI 가 바뀐 패키지를 보고 고른다

workflows:
  plan:
    label: 계획을 세우고 승인받은 뒤 구현
    stages: [plan, implement, verify, finalize]
  quick:
    label: 계획 없이 — 검증할 패키지는 AI 가 고른다
    stages: [implement, verify, finalize]
    choosable: {verify: auto}

stages:
  plan:
    prompt_file: prompts/plan.md
  implement:
    prompt: 계획대로 구현한다.
  verify:
    prompt: 전체 타입 체크를 통과시킨다.
    run: pnpm -r typecheck
    choosable: ask
    items:
      api:    {label: api 패키지,    run: pnpm --filter @app/api test}
      web:    {label: web 패키지,    run: pnpm --filter @app/web test}
      shared: {label: shared 패키지, run: pnpm --filter @app/shared test}
  finalize:
    prompt: 변경 파일을 개별 git add 하고 커밋·push 한다.
