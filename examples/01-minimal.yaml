# ─────────────────────────────────────────────────────────────
# 가장 작은 워크플로우 — 여기서 시작해서 필요한 것만 더해라.
#
# 스테이지 키는 3개뿐이다:
#   steps    이 단계에서 할 일 (순서 보장)
#   forbid   이 단계에 머무는 동안 금지되는 것
#   on_fail  조건을 못 채우면 되돌아갈 앞선 단계
# ─────────────────────────────────────────────────────────────
version: 1

workflows:
  # 이 목록이 /dev-bounce 실행 시 그대로 모드 선택지가 된다.
  # label은 선택지 설명으로 표시된다.
  simple:
    label: 계획 없이 바로 구현
    # 배열 순서대로 진행한다. 마지막이 종단 — 여기 도달하면 작업이 끝난다.
    stages: [implement, verify, done]

stages:
  implement:
    steps:
      # blocking이 없으면 "알려주기만" 한다. 안 지켜도 다음 단계로 간다.
      - label: 구현
        inject: |
          요청받은 변경을 구현해라. 끝나도 멈추지 말고 검증까지 진행한다.

  verify:
    steps:
      # inject + blocking: true = 실제 사용자 턴이 있어야 통과한다.
      # 모델이 혼자 `bouncer done`을 쳐도 넘어가지 못한다.
      - label: 검증 보고
        inject: |
          테스트·빌드를 실행하고 결과를 사용자에게 보고해라. 추측 금지.
        blocking: true

  # 정의가 필요 없는 단계라도 stages에는 반드시 있어야 한다.
  # (오타난 스테이지 이름으로 단계가 조용히 사라지는 것을 막기 위해)
  done:
    steps:
      - label: 완료 보고
        inject: 무엇을 바꿨는지 요약해 보고하고 멈춰라.
