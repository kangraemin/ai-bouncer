# 가장 작은 레포 설정 — 모드 하나, 단계 둘.
# 적지 않은 것은 없다. 레포가 workflows 를 적으면 기본 모드 목록을 통째로 대신한다.
#
#   prompt  그 단계에서 할 일 (들어오면 주입한다)
#   run     끝내려 할 때 도는 검사. 전부 exit 0 이어야 다음 단계로 간다
# 마지막 단계의 run 까지 통과해야 멈출 수 있다.

workflows:
  simple:
    label: 바로 구현하고 테스트
    stages: [implement, verify]

stages:
  implement:
    prompt: 요청받은 것을 구현한다.
  verify:
    prompt: 테스트를 돌려 통과를 확인한다.
    items:                         # 검사는 항목으로 둔다. 시작할 때 고른 것만 돈다 (기본 choosable: ask)
      test: {run: npm test}
