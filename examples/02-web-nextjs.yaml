# 웹 프론트엔드 (Next.js) — 검사를 run 에 맡기는 형태.
# run 은 실제 종료코드로 판정하므로 "통과했습니다"라고 말해도 넘어가지 못한다.
# 무거운 e2e 는 items 로 빼고, 시작할 때 사용자에게 할지 묻는다(choosable: ask).

workflows:
  plan:
    label: 계획을 세우고 승인받은 뒤 구현
    stages: [plan, implement, verify, finalize]
  quick:
    label: 오타·문구 수정 — e2e 는 AI 가 판단
    stages: [implement, verify, finalize]
    choosable: {verify: auto}

stages:
  plan:
    prompt_file: prompts/plan.md
  implement:
    prompt: 계획대로 구현한다.
  verify:
    prompt: 타입·린트·유닛 테스트·빌드를 통과시킨다.
    run:
      - npx tsc --noEmit
      - npm run lint
      - npm test -- --run
      - npm run build
    choosable: ask
    items:
      e2e:
        label: Playwright e2e
        prompt: 화면 흐름이 바뀌었으면 e2e 를 돌린다.
        run: npx playwright test
  finalize:
    prompt: 변경 파일을 개별 git add 하고 커밋·push 한다.
