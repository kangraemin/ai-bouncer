# ─────────────────────────────────────────────────────────────
# 모바일 앱 (React Native) — 자동화로 못 잡는 것을 사람에게 넘기는 형태.
#
# 핵심: 시뮬레이터가 못 재현하는 것(햅틱·권한·딥링크)은 `inject` + `blocking: true`로
#       사람 확인을 강제한다. 단 이건 "사람이 봤다"까지만 보장하고
#       "제대로 봤다"는 보장하지 못한다 — 자동화 가능한 건 전부 `run`으로 써라.
# ─────────────────────────────────────────────────────────────
version: 1

workflows:
  plan:
    label: 계획을 세우고 승인받은 뒤 구현
    stages: [plan, implement, verify, finalize, done]

stages:

  plan:
    steps:
      - label: 계획 승인
        inject: |
          계획 단계다. 첫 tool call은 반드시 EnterPlanMode다.
          변경 파일별 Before/After를 실제 코드로 적고, 네이티브 모듈이 바뀌면
          iOS/Android 양쪽 영향과 재빌드 필요 여부까지 적어라.
        blocking: plan_approved
    forbid:
      edit_files: true
      reason: 계획 승인 전 코드 수정 금지.

  implement:
    steps:
      - label: 구현
        inject: 계획대로 구현해라.
      - label: 타입 체크
        run: "npx tsc --noEmit"
        timeout: 180
        blocking: true
    forbid:
      push: true
      reason: 검증 전 push 금지.

  verify:
    on_fail: implement
    steps:
      - label: 유닛 테스트
        run: "npm test -- --ci"
        timeout: 600
        blocking: true

      - label: 시뮬레이터 e2e
        run: "npx maestro test .maestro/"
        timeout: 1800
        blocking: true
        optional: true

      # 자동화 불가 영역. 모델 혼자서는 절대 통과하지 못한다 —
      # 엔진이 "실제 사용자 턴"을 확인한 뒤에야 인정한다.
      - label: 실기기 확인
        inject: |
          시뮬레이터로 못 잡는 것을 실기기에서 직접 확인해라 —
          햅틱, 권한 팝업, 딥링크, 백그라운드 복귀, 노치/홈 인디케이터 영역.
          무엇을 어떻게 확인했는지 구체적으로 보고해라.
        blocking: true
        optional: true
    forbid:
      push: true
      reason: 검증 전 push 금지.

  finalize:
    steps:
      - label: 커밋과 푸시
        inject: 변경 파일을 개별 add → 커밋 → push.
      - label: 워킹트리 정리 확인
        run: 'test -z "$(git status --porcelain)"'
        by: engine
        blocking: true

  done:
    steps:
      - label: 완료 보고
        inject: 요약해 보고하고 멈춰라.
