# 백엔드 (Python) — 새 단계를 끼워 넣는 예시.
# policy 는 기본 단계가 아니다. 모드의 stages 에 이름을 넣고 stages 에 정의하면 끝이다.

workflows:
  plan:
    label: 계획 승인 후 구현 (정리 포함)
    stages: [plan, implement, verify, policy, finalize]
  hotfix:
    label: 긴급 수정 — 최소 검증만
    stages: [implement, verify, finalize]

stages:
  plan:
    prompt_file: prompts/plan.md
  implement:
    prompt: 계획대로 구현한다.
  verify:
    items:
      test: {label: 타입 체크·테스트, run: [mypy src/, pytest -q]}
  policy:
    prompt: 디버그 출력을 지우고 CHANGELOG 에 변경을 적는다.
    run:
      - "! grep -rn 'print(' src/ --include='*.py'"
      - git diff --name-only HEAD | grep -q CHANGELOG
  finalize:
    prompt: 변경 파일을 개별 git add 하고 커밋·push 한다.
