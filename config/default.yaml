# ai-bouncer 기본 워크플로우 — 전역 엔진 소유. 설치/업데이트 때마다 덮어쓴다.
# 레포 .claude/ai-bouncer/workflow.yaml 은 같은 형식이다. workflows 를 적으면 아래 모드 목록을 통째로 대신하고,
# stages 는 이름 단위로 교체하거나 추가한다.
#
#   workflows.<모드>   = 단계 순서. 마지막 단계까지 끝나야 Stop 에서 멈출 수 있다
#   stages.<단계>      = prompt(할 일, md 파일 가능) + run(통과 조건, 전부 exit 0 이면 다음 단계)
#   items + choosable  = 세부 항목과 고르는 방식. ask 사용자에게 묻는다 / auto AI 가 고른다 / all 전부(기본)
# 스키마: docs/SCHEMA.md

workflows:
  plan:
    label: 계획을 세우고 승인받은 뒤 구현
    stages: [plan, implement, verify, finalize]
  simple:
    label: 계획 없이 바로 구현
    stages: [implement, verify, finalize]

stages:
  plan:
    prompt_file: prompts/plan.md

  implement:
    prompt: |
      [implement] 구현 단계다. 계획을 세운 뒤라면 그 계획대로 옮긴다.

  verify:
    prompt: |
      [verify] 검증 단계다. 추측 금지 — 실제로 실행해서 확인한다.
        - 요청받은 범위가 전부 구현됐는지 다시 대조한다. 빠진 것은 지금 마저 한다.
        - 실패한 것을 통과로 보고하지 않는다.
    choosable: ask
    items:
      test:
        label: 테스트·빌드·린트 실행
        prompt: 이 프로젝트의 테스트 / 빌드 / 린트를 실행하고 결과를 확인한다.
      review:
        label: 변경분 리뷰
        prompt: git diff 를 처음부터 끝까지 읽고 버그·누락·불필요한 변경을 찾아 고친다.

  finalize:
    prompt: |
      [finalize] 마무리 단계다.
        1. 변경 파일을 개별 git add 한다. `git add .` / `-A` 금지.
        2. 커밋하고 push한다.
        3. 이번 작업과 무관한 WIP는 커밋하지 않고 그대로 둔다(stash·삭제 금지).
