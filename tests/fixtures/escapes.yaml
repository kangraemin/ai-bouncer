# 따옴표 이스케이프가 두 파서에서 같게 풀리는지 (정규식이 조용히 달라지던 자리)
workflows:
  simple: {label: 이스케이프, stages: [implement]}
stages:
  implement:
    prompt: "탭\t줄바꿈\n따옴표\" 백슬래시\\ 유니코드é"
    run:
      - "curl .*\\| *(bash|sh)"      # \\ 가 리터럴 백슬래시 하나
      - 'raw \| single'              # 백슬래시 그대로
      - "npm .*\\bpublish\\b"
    items:
      a: {label: 겹따옴표, prompt: "x \"y\" z"}
      b: {label: 홑따옴표, prompt: 'it''s'}
