version: 1
base: none        # 기본값 없이 이 파일 하나로 완결된 워크플로우
workflows:
  plan:
    label: 테스트용
    stages: [implement, verify, done]
stages:
  implement:
    steps:
      - label: 구현
        inject: "구현해라."
  verify:
    on_fail: implement
    steps:
      - label: 게이트
        run: 'test -f PASS'
        by: engine
        blocking: true
    forbid:
      push: true
      reason: 검증이 끝나기 전에는 push할 수 없다.
  done:
    steps:
      - label: 완료
        inject: "끝."
