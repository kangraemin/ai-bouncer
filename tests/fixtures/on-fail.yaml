version: 1
workflows:
  plan:
    label: 테스트용
    stages: [implement, verify, done]
stages:
  implement:
    steps:
      - label: 구현
        inject: "구현해라."
  verify:
    on_fail: implement
    steps:
      - label: 게이트
        run: 'test -f PASS'
        by: engine
        blocking: true
    forbid:
      edit_files: true
      reason: 검증 단계에서는 수정 금지. 구현 단계로 돌아가라.
  done:
    steps:
      - label: 완료
        inject: "끝."
